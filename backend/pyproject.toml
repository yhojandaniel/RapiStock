[project]
name = "backend"
version = "0.1.0"
description = "API para RapiStock"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic==1.18.3",
    "asyncpg>=0.29.0",
    "fastapi[standard]==0.128.0",
    "multipart>=1.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.2.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlmodel==0.0.31",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
